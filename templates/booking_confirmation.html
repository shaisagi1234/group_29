<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Confirmed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e8f5e9; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        .card { padding: 40px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="card">
    <h1 class="text-success display-4">Booking Confirmed!</h1>
    <p class="lead">Your flight has been successfully booked.</p>
    <hr>
    <h3>Order ID: <span class="text-primary">#{{ order_id }}</span></h3>
    <p>A confirmation email has been sent to <strong>{{ email }}</strong></p>
    
    <div class="mt-4">
        <a href="/" class="btn btn-outline-success">Back to Home</a>
    </div>
</div>

</body>
</html>
