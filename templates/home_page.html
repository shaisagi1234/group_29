{% extends "layout.html" %}

{% block content %}
<datalist id="airports">
    {% for airport in airports %}
    <option value="{{ airport.city }} ({{ airport.airport_code }})">
        {% endfor %}
</datalist>

<div class="hero-section">
    <div class="hero-content">
        <h1 class="main-title">Discover Your Next Adventure</h1>
        <p class="subtitle">Explore the world with Fly Tau</p>

        <div class="search-bar-container">
            <form action="/search-results" method="POST" class="horizontal-search-form">

                <div class="search-item">
                    <label><i class="fas fa-plane-departure"></i> From</label>
                    <input list="airports" name="origin" placeholder="Where from?" required>
                </div>

                <div class="divider"></div>

                <div class="search-item">
                    <label><i class="fas fa-plane-arrival"></i> To</label>
                    <input list="airports" name="destination" placeholder="Where to?" required>
                </div>

                <div class="divider"></div>

                <div class="search-item">
                    <label><i class="far fa-calendar-alt"></i> Date</label>
                    <input type="date" name="departure_date" min="{{ today }}" value="{{ today }}" required>
                </div>

                <div class="divider"></div>

                <div class="search-item small-item">
                    <label><i class="fas fa-user-friends"></i> Travelers</label>
                    <input type="number" name="passengers" min="1" max="10" value="1" required>
                </div>

                <button type="submit" class="search-btn">
                    Search
                </button>
            </form>
        </div>
    </div>
</div>

<style>
    /* רקע כללי לדף הבית עם תמונה יפה */
    .hero-section {
        background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
        background-size: cover;
        background-position: center;
        height: 90vh;
        /* תופס את רוב המסך */
        display: flex;
        align-items: center;
        /* ממרכז אנכית */
        justify-content: center;
        /* ממרכז אופקית */
        text-align: center;
        color: white;
    }

    .main-title {
        font-size: 3.5rem;
        font-weight: 700;
        margin-bottom: 10px;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
    }

    .subtitle {
        font-size: 1.2rem;
        margin-bottom: 40px;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
    }

    /* --- עיצוב בר החיפוש לרוחב --- */
    .search-bar-container {
        background: white;
        padding: 10px;
        border-radius: 100px;
        /* פינות עגולות מאוד (צורת גלולה) */
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        /* צל עמוק ויפה */
        display: inline-block;
        /* כדי שהרוחב יתאים לתוכן */
        max-width: 1000px;
        width: 90%;
    }

    .horizontal-search-form {
        display: flex;
        /* זה הסוד - מסדר הכל בשורה אחת */
        align-items: center;
        justify-content: space-between;
        width: 100%;
    }

    .search-item {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 5px 20px;
        flex: 1;
        /* כל שדה תופס מקום שווה */
        position: relative;
    }

    .search-item label {
        font-size: 0.8rem;
        font-weight: bold;
        color: #333;
        margin-bottom: 5px;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .search-item input {
        border: none;
        outline: none;
        width: 100%;
        font-size: 1rem;
        color: #555;
        background: transparent;
        font-family: inherit;
    }

    /* עיצוב מיוחד לשדה תאריך כדי שייראה טוב */
    input[type="date"] {
        color: #555;
    }

    .small-item {
        flex: 0.5;
        /* שדה הנוסעים קטן יותר */
        min-width: 80px;
    }

    /* הקו המפריד בין השדות */
    .divider {
        width: 1px;
        height: 40px;
        background-color: #ddd;
    }

    /* כפתור החיפוש */
    .search-btn {
        background: #007bff;
        /* כחול יפה */
        color: white;
        border: none;
        padding: 15px 35px;
        border-radius: 50px;
        /* כפתור עגול */
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-left: 10px;
    }

    .search-btn:hover {
        background: #0056b3;
        /* כחול כהה יותר בהובר */
        transform: translateY(-2px);
        /* קפיצה קטנה למעלה */
        box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
    }

    /* התאמה למובייל - אם המסך קטן מדי, זה יחזור להיות אחד מתחת לשני */
    @media (max-width: 768px) {
        .search-bar-container {
            border-radius: 20px;
            padding: 20px;
        }

        .horizontal-search-form {
            flex-direction: column;
            /* הופך לטור */
            gap: 15px;
        }

        .divider {
            display: none;
            /* מסתיר את הקווים במובייל */
        }

        .search-item {
            width: 100%;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .search-btn {
            width: 100%;
            margin-left: 0;
            margin-top: 10px;
        }
    }
</style>
{% endblock %}
